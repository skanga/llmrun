[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmrun"
version = "0.1.0"
description = "Small OpenAI/Codex OAuth CLI for prompts, sessions, templates, and fragments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "openai>=1.99",
  "platformdirs>=4.0",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "black>=26.0",
  "coverage>=7.0",
  "mypy>=2.0",
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.15",
]

[project.scripts]
llmrun = "llmrun.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest-runtime/cache"
